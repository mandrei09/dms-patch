# DMS looks for the file-index backend by running `command -v dsearch`
# (Services/DSearchService.qml). Ubuntu's package installs that binary as
# `danksearch`, so the probe always failed and spotlight silently ran
# without file results -- the same reason `dms doctor` reports danksearch
# as "Not installed" while it is installed and serving.
#
# ~/.local/bin/dsearch is a symlink to /usr/bin/danksearch; this puts that
# directory on the shell's PATH so the probe finds it.
[Service]
Environment=PATH=%h/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin
