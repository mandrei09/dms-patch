# Run the locally patched DMS QML tree instead of the one embedded in the
# `dms` binary.
#
# DMS 1.6 carries its whole UI inside /usr/bin/dms and unpacks it to
# /run/user/$UID/danklinux-shell/<rev> on startup, so editing
# /usr/share/quickshell/dms (the reference copy the package also ships) has no
# effect -- it is not what gets loaded. `-c DIR` / DMS_SHELL_DIR is the
# supported override.
#
# ExecStartPre rebuilds that directory from /usr/share and re-applies the local
# patches on every start, so a `dms` package update can't leave a stale or
# half-patched shell behind. See ~/.local/bin/dms-shell-sync.

[Service]
Environment=DMS_SHELL_DIR=%h/.local/share/dms-shell
ExecStartPre=%h/.local/bin/dms-shell-sync
