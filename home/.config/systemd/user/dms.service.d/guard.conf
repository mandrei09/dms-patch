# After every DMS start, check that the local patches and helpers survived
# (see ~/Documents/dms-update-guard/dms-update-check). Delayed and detached:
# the notification daemon IS DMS, so it has to be up before we can report.
[Service]
ExecStartPost=-/bin/sh -c '(sleep 20; %h/Documents/dms-update-guard/dms-update-check --notify) >/dev/null 2>&1 &'
