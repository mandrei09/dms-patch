# Hyprland 0.53 (hyprlang) config for the DMS login screen, installed as
# /etc/greetd/dms-hyprland.conf and passed with `-C` in /etc/greetd/config.toml.
# Why: dms-greeter 1.6.2 otherwise generates a Lua config, which needs Hyprland
# 0.55+ and makes 0.53 crash at the login screen. dms-greeter appends its own
# exec line (the login UI) to this file.
env = DMS_RUN_GREETER,1

# same outputs/scaling as the desktop (~/.config/hypr/monitors.conf)
monitor = eDP-1,1920x1080@60,0x0,1.25
monitor = DP-2,2560x1440@165,auto,1.3333
monitor = HDMI-A-1,2560x1440@60,auto,1.25
monitor = Virtual-1,2560x1440@60,0x0,1.25
monitor = ,preferred,auto,1.25

input {
    kb_layout = us,ro
}

# the login UI is Wayland-only; Xwayland only slowed greeter start/exit
xwayland {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
